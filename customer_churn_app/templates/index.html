<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Customer Churn Prediction</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #74ABE2, #5563DE);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        h1 { margin-bottom: 10px; }
        form {
            background-color: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 15px;
            width: 400px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        input, select {
            padding: 8px;
            border: none;
            border-radius: 5px;
        }
        button {
            padding: 10px;
            background-color: #fff;
            color: #333;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .result {
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>🔮 Customer Churn Prediction</h1>
    <form action="/predict" method="post">
        <input type="number" step="any" name="tenure" placeholder="Tenure (months)" required>
        <input type="number" step="any" name="MonthlyCharges" placeholder="Monthly Charges" required>
        <input type="number" step="any" name="TotalCharges" placeholder="Total Charges" required>
        <input type="number" step="any" name="SeniorCitizen" placeholder="Senior Citizen (0/1)" required>
        <input type="number" step="any" name="Contract" placeholder="Contract (0=Month-to-month, 1=One year, 2=Two year)" required>
        <input type="number" step="any" name="InternetService" placeholder="Internet Service (0=None, 1=DSL, 2=Fiber)" required>
        <button type="submit">Predict</button>
    </form>

    {% if prediction_text %}
        <div class="result">{{ prediction_text }}</div>
    {% endif %}
</body>
</html>
